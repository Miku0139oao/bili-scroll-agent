name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go
        run: |
          go test -race ./...
          go vet ./...

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Test and build WebUI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
          bun audit

      - name: Embed WebUI and build Go binaries
        run: |
          mkdir -p internal/webui/dist
          cp -a web/dist/. internal/webui/dist/
          go build -trimpath ./cmd/bili-scroll-server
          go build -trimpath ./cmd/bili-scroll-mcp
          go build -trimpath ./cmd/bili-scroll-usage-sync

      - name: Validate configuration fixtures
        run: |
          bash -n deploy/install.sh
          bash -n deploy/update.sh
          bash -n deploy/backup.sh

